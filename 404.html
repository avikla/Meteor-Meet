<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-F96GRW2MG9"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-F96GRW2MG9');
  </script>
  <script>
    // Redirect /en, /fr, /he (and any other unmatched path) to a real
    // index.html load via ?lang=, preserving query string and hash (event links).
    // Scripts inserted via DOMParser + replaceWith never execute (per HTML spec),
    // so the previous fetch-and-swap approach left the page completely inert.
    const path = window.location.pathname;
    const match = path.match(/^\/(en|fr|he)(?:\/|$)/);
    const params = new URLSearchParams(window.location.search);
    if (match) params.set('lang', match[1]);
    const qs = params.toString();
    window.location.replace('/' + (qs ? '?' + qs : '') + window.location.hash);
  </script>
</head>

</html>
